<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国标准书号条码生成器 (GB/T 12906-2008)</title>
    <!-- 引入 OCR-B 字体 -->
    <link href="https://fonts.cdnfonts.com/css/ocr-b" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f5f6fa;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            font-family: 'OCR-B', 'Courier New', monospace;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-item {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button.secondary {
            background-color: #27ae60;
            margin-top: 20px;
        }

        button.secondary:hover {
            background-color: #219150;
        }

        #preview-area {
            margin-top: 30px;
            padding: 20px;
            border: 1px dashed #ccc;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            overflow: auto;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }
        
        @media print {
            body { background: white; }
            .container { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

    <h1>中国标准书号条码生成器</h1>
    <div class="subtitle">严格遵循 GB/T 12906-2008 & ISO 1073 标准</div>

    <div class="container">
        <div class="input-group">
            <label for="isbnInput">ISBN 号码 (自动计算校验位)</label>
            <input type="text" id="isbnInput" placeholder="例如: 978-7-123-45678-9" value="978-7-5066-6666-6">
            <div id="errorMsg" class="error-msg">请输入有效的 ISBN 号码</div>
        </div>

        <div class="controls">
            <div class="control-item">
                <label for="scale">放大系数 (0.80 - 2.00)</label>
                <input type="number" id="scale" min="0.8" max="2.0" step="0.05" value="1.00">
            </div>
            <div class="control-item">
                <label for="barHeight">条高修正 (mm)</label>
                <input type="number" id="barHeight" value="22.85" step="0.1" title="标准条高为22.85mm">
            </div>
        </div>

        <button onclick="generateBarcode()">生成预览</button>

        <div id="preview-area">
            <div style="color: #999;">条码将在此处生成...</div>
        </div>

        <button class="secondary" onclick="downloadSVG()">下载 SVG (矢量印刷用)</button>
    </div>

    <script>
        /**
         * GB/T 12906-2008 技术参数
         * 模块宽度 (X) = 0.33mm (1.00倍放大系数时)
         */
        const BASE_MODULE_WIDTH_MM = 0.33; 
        
        /**
         * 供人识别字符参数 (基于 ISO 1073 / GB/T 12508)
         * OCR-B Size I 标准高度约为 2.75mm
         */
        const OCR_CHAR_HEIGHT_MM = 2.75;

        // EAN-13 编码表
        const BINARY_MAP = {
            L: ["0001101", "0011001", "0010011", "0111101", "0100011", "0110001", "0101111", "0111011", "0110111", "0001011"],
            G: ["0100111", "0110011", "0011011", "0100001", "0011101", "0111001", "0000101", "0010001", "0001001", "0010111"],
            R: ["1110010", "1100110", "1101100", "1000010", "1011100", "1001110", "1010000", "1001000", "1001000", "1110100"]
        };

        const PARITY_PATTERN = [
            "LLLLLL", "LLGLGG", "LLGGLG", "LLGGGL", "LGLLGG", 
            "LGGLLG", "LGGGLL", "LGLGLG", "LGLGGL", "LGGLGL"
        ];

        function calculateCheckDigit(digits) {
            let sum = 0;
            for (let i = 0; i < 12; i++) {
                sum += parseInt(digits[i]) * (i % 2 === 0 ? 1 : 3);
            }
            let remainder = sum % 10;
            return remainder === 0 ? 0 : 10 - remainder;
        }

        function cleanInput(input) {
            return input.replace(/[^0-9]/g, '');
        }

        function generateBarcode() {
            const inputVal = document.getElementById('isbnInput').value;
            const scale = parseFloat(document.getElementById('scale').value) || 1.0;
            const userBarHeight = parseFloat(document.getElementById('barHeight').value) || 22.85;
            const errorDiv = document.getElementById('errorMsg');
            
            let rawCode = cleanInput(inputVal);

            if (rawCode.length === 12) rawCode += calculateCheckDigit(rawCode);

            if (rawCode.length !== 13) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = "错误：请输入 12 或 13 位数字";
                return;
            }

            const checkDigit = calculateCheckDigit(rawCode);
            if (parseInt(rawCode[12]) !== checkDigit) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = `校验位修正：${rawCode[12]} -> ${checkDigit}`;
                rawCode = rawCode.substring(0, 12) + checkDigit;
                document.getElementById('isbnInput').value = rawCode;
            } else {
                errorDiv.style.display = 'none';
            }

            renderSVG(rawCode, scale, userBarHeight);
        }

        function renderSVG(code, scale, standardBarHeightMm) {
            const container = document.getElementById('preview-area');
            container.innerHTML = '';

            // 1. 物理尺寸计算 (mm)
            const moduleWidthMm = BASE_MODULE_WIDTH_MM * scale;
            const barHeightShortMm = standardBarHeightMm * scale;
            // 警戒条下伸长度 (通常约 5个模块 或 1.65mm)
            const guardExtensionMm = 1.65 * scale;
            const barHeightGuardMm = barHeightShortMm + guardExtensionMm;

            // 字符高度与间距 (4.1.1.9)
            const charHeightMm = OCR_CHAR_HEIGHT_MM * scale;
            const textGapMm = 0.5 * moduleWidthMm; // 最小距离 0.5 模块
            
            // 总高度计算: 短条高度 + 间距 + 字符高度 + 底部留白(少量)
            const totalHeightMm = barHeightShortMm + textGapMm + charHeightMm + (0.5 * scale);
            
            // 总宽度 (113 模块)
            const totalModules = 113;
            const totalWidthMm = totalModules * moduleWidthMm;

            // 2. SVG 坐标系统 (使用模块单位以简化绘图)
            const mmToMod = 1 / moduleWidthMm; // 毫米转模块系数
            const barHeightShortMod = barHeightShortMm * mmToMod;
            const barHeightGuardMod = barHeightGuardMm * mmToMod;
            
            // 计算文字基线 (Baseline) 在模块坐标系中的位置
            // 基线 Y = 短条底部 + 间距 + 字符高度
            // 注意：SVG text y 是基线，所以需要加上字符高度
            const textBaselineYMod = (barHeightShortMm + textGapMm + charHeightMm) * mmToMod;

            // 计算 SVG 字体大小 (模块单位)
            const fontSizeMod = charHeightMm * mmToMod; // ≈ 8.33 模块

            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            
            svg.setAttribute("width", `${totalWidthMm.toFixed(3)}mm`);
            svg.setAttribute("height", `${totalHeightMm.toFixed(3)}mm`);
            svg.setAttribute("viewBox", `0 0 ${totalModules} ${totalHeightMm * mmToMod}`);
            svg.setAttribute("xmlns", svgNS);
            svg.id = "barcode-svg";

            const bg = document.createElementNS(svgNS, "rect");
            bg.setAttribute("width", "100%");
            bg.setAttribute("height", "100%");
            bg.setAttribute("fill", "white");
            svg.appendChild(bg);

            // 3. 二进制编码
            const firstDigit = parseInt(code[0]);
            const leftSix = code.substring(1, 7);
            const rightSix = code.substring(7, 13);
            const parity = PARITY_PATTERN[firstDigit];

            let binaryStream = "101"; // 起始 (3)
            for (let i = 0; i < 6; i++) binaryStream += BINARY_MAP[parity[i]][parseInt(leftSix[i])]; // 左数据 (42)
            binaryStream += "01010"; // 中间 (5)
            for (let i = 0; i < 6; i++) binaryStream += BINARY_MAP['R'][parseInt(rightSix[i])]; // 右数据 (42)
            binaryStream += "101"; // 终止 (3)

            // 4. 绘制条 (Rects)
            let currentX = 11; // 左侧空白区起始点 (11 模块)
            
            for (let i = 0; i < binaryStream.length; i++) {
                if (binaryStream[i] === '1') {
                    const rect = document.createElementNS(svgNS, "rect");
                    rect.setAttribute("x", currentX);
                    rect.setAttribute("y", 0);
                    rect.setAttribute("width", 1);
                    
                    // 判断是否为警戒条 (起始、中间、终止)
                    // Index: 0-2 (Start), 45-49 (Center), 92-94 (Stop)
                    let isGuard = (i < 3) || (i >= 45 && i < 50) || (i >= 92);
                    rect.setAttribute("height", isGuard ? barHeightGuardMod : barHeightShortMod);
                    rect.setAttribute("fill", "black");
                    svg.appendChild(rect);
                }
                currentX++;
            }

            // 5. 绘制供人识别字符 (OCR-B)
            // 使用 textLength 和 lengthAdjust 确保字符宽度分布均匀
            
            const createText = (text, x, anchor) => {
                const t = document.createElementNS(svgNS, "text");
                t.setAttribute("x", x);
                t.setAttribute("y", textBaselineYMod); 
                t.setAttribute("font-family", "'OCR-B', 'OCR-B 10 BT', 'Monospace', monospace");
                t.setAttribute("font-size", fontSizeMod);
                t.setAttribute("text-anchor", anchor);
                t.setAttribute("fill", "black");
                t.textContent = text;
                return t;
            };

            // (A) 前置码 "9"
            // 位置：印制在条码符号起始符的左侧 (左空白区内)
            // 左空白区宽 11，建议放在约 X=7 的位置，右对齐或居中
            svg.appendChild(createText(code[0], 7, "middle")); 

            // (B) 左侧数据符 (6位)
            // 数据区范围：Start(14) 到 Center(56)。宽度 42。
            // 中心点：14 + 21 = 35。
            const tLeft = createText(leftSix, 35, "middle");
            // 稍微拉伸字符间距以填满数据区，提高可读性
            tLeft.setAttribute("textLength", "38"); 
            tLeft.setAttribute("lengthAdjust", "spacingAndGlyphs");
            svg.appendChild(tLeft);

            // (C) 右侧数据符 (6位)
            // 数据区范围：CenterEnd(61) 到 CheckEnd(103)。宽度 42。
            // 中心点：61 + 21 = 82。
            const tRight = createText(rightSix, 82, "middle");
            tRight.setAttribute("textLength", "38");
            tRight.setAttribute("lengthAdjust", "spacingAndGlyphs");
            svg.appendChild(tRight);

            // 6. 绘制右侧空白区标识符 ">" (4.1.1.8)
            // 位置：右端距终止符右边缘最小宽度为 7 个模块宽。
            // 终止符右边缘 = 106。
            // ">" 的尖端 X 坐标 = 106 + 7 = 113。
            
            const indicatorGroup = document.createElementNS(svgNS, "g");
            
            const arrowTipX = 113; 
            
            // 垂直居中于文字 (视觉调整)
            // OCR-B 字符大约占据基线上方 0.7em 到 0.8em 的高度
            // 将 ">" 的中心设置在基线上方 0.35em 处 (约字符中部)
            const arrowCenterY = textBaselineYMod - (fontSizeMod * 0.35);
            
            // 大小：不大于供人识别字符高度
            // 设定高度约为字符高度的 60%
            const arrowHeightHalf = fontSizeMod * 0.3; 
            const arrowWidth = fontSizeMod * 0.4;

            const path = document.createElementNS(svgNS, "path");
            // 绘制 ">"
            const d = `M ${arrowTipX - arrowWidth} ${arrowCenterY - arrowHeightHalf} 
                       L ${arrowTipX} ${arrowCenterY} 
                       L ${arrowTipX - arrowWidth} ${arrowCenterY + arrowHeightHalf}`;
            
            path.setAttribute("d", d);
            path.setAttribute("fill", "none");
            path.setAttribute("stroke", "black");
            path.setAttribute("stroke-width", "1.3");
            path.setAttribute("stroke-linecap", "square");
            path.setAttribute("stroke-linejoin", "miter");
            
            indicatorGroup.appendChild(path);
            svg.appendChild(indicatorGroup);

            container.appendChild(svg);
        }

        function downloadSVG() {
            const svgEl = document.getElementById("barcode-svg");
            if (!svgEl) {
                alert("请先生成条码");
                return;
            }
            const serializer = new XMLSerializer();
            let source = serializer.serializeToString(svgEl);
            if(!source.match(/^<\?xml/)) source = '<?xml version="1.0" standalone="no"?>\r\n' + source;
            const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
            const downloadLink = document.createElement("a");
            const isbn = document.getElementById('isbnInput').value;
            downloadLink.href = url;
            downloadLink.download = `ISBN-${isbn}.svg`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        generateBarcode();
    </script>
</body>
</html>
